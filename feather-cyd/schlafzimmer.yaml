# ============================================================
# Schlafzimmer - Cheap Yellow Display (ESP32-2432S028, ILI9341 + XPT2046) as a Feather screen.
#
# Left: the Chronicle's notification list (Feather pushes it over the native API).
# Right: desk stand, ArmLight toggle and desk sit, which go through Home Assistant, and Feather's
# GPU mode toggle (lit = coding mode, greyed while switching; Feather decides, set_mode reports it).
#
# Feather drives this over ESPHome's native API, the same way Home Assistant does
# (feather/gjallarhorn/cyd.py, aioesphomeapi). Home Assistant stays connected too, for the
# desk/lamp buttons and the office air readings - the API allows several clients at once.
#
# BUILD WITH ESPHome 2025.12.0 - the version the original firmware used, with touch working.
# XPT2046 touch is reported broken on this board in 2026.4+ (esphome/esphome#16879). Do not
# rebuild this from a newer ESPHome (e.g. the HA add-on) without re-checking that issue.
#
# Previous firmware: ../Schlafzimmer.YAML (the 12-button grid) - flash that back to undo.
#
# Pictures (2026-10-19): Feather can put any image on screen (its show_on_screen tool). Feather
# fits it to 320x240 and sends it as raw RGB565 in strips (show_image_rows), which go straight to
# the panel - a full frame is 150 KB and this board has no PSRAM, so it's never held here. LVGL
# is paused meanwhile; a tap (or the picture's timeout) brings the notifications back behind the
# wake catcher, so the tap that dismisses a picture can never also press the desk buttons.
#
# LCARS skin (2026-11-06): matches Feather's web UI LCARS theme (feather/static/index.html:
# grey/tan/mauve/lilac/orange/red, no blues, Antonio font). Fixed - set_theme pushes are accepted
# but ignored, since a colour-only palette can't draw the LCARS shapes.
#
# Pages (2026-11-06), picked from the LCARS footer bar along the bottom (ALERTS / AIR / SYSTEM):
#   ALERTS  the notification cards + desk/lamp/GPU pill buttons (the home page)
#   AIR     office readings from Home Assistant: CO2, PM2.5, radiation, temperature, humidity -
#           each a value block coloured by health and an 8 h trend line (sampled here every 5 min,
#           96 points - starts empty after a reboot)
#   SYSTEM  Feather's LLM metrics (set_llm)
# AIR and SYSTEM drop back to ALERTS after 60 s. The frame, header and footer live on LVGL's top
# layer so every page shares them; pages only draw inside x 16..318, y 22..210.
# Health colours (muted LCARS, Feather's theme): green good, tan moderate, orange poor, red bad,
# grey no data. Thresholds - CO2 800 / 1200 / 2000 ppm; PM2.5 12 / 35.5 / 55.5 ug/m3 (US AQI);
# radiation 0.3 / 1 / 10 uSv/h (or the Geiger counter's own warning = bad); temperature good
# 19-24, moderate 17-26, poor 15-28 C; humidity good 40-60, moderate 30-65, poor 20-70 %.
# The elbow + upper sidebar show the WORST of CO2 / PM2.5 / radiation on every page, with lilac
# in place of green so a healthy room keeps the usual LCARS frame.
# The footer's SYSTEM segment turns tan/red when the SYSTEM page needs a look; ALERTS shows "+N".
#
# Backlight floor (2026-11-06): never below 25% outside quiet hours (Feather's set_status quiet
# flag) AND outside 21:00-06:00 local - the clock guard keeps it dark at night if Feather is
# down and the quiet flag never arrives. Inside quiet hours Feather's levels (off / faint glow)
# stand. Since the backlight then stays on all day, Ambient Light only reports while the
# backlight is really off - otherwise it reads the screen's own glow and would skew Feather's
# room-light estimate.
# ============================================================

esphome:
  name: schlafzimmer
  friendly_name: Schlafzimmer
  on_boot:
    priority: -100
    then:
      - script.execute: apply_backlight
      - script.execute: render_aq
      - script.execute: render_footer

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key
  actions:
    # Kept from the original firmware, unchanged.
    - action: set_desk_standing
      then:
        - homeassistant.action:
            action: script.setdeskstanding
    - action: set_desk_sitting
      then:
        - homeassistant.action:
            action: script.setdesksitting

    # ---- Feather -> screen ------------------------------------------------------------
    # The notification list: up to 3 cards, plus how many more are waiting.
    - action: show_notifications
      variables:
        ids: int[]
        tiers: string[]
        titles: string[]
        more: int
      then:
        - lambda: |-
            for (int i = 0; i < 3; i++) {
              bool used = i < (int) ids.size() && i < (int) titles.size();
              id(card_ids)[i] = used ? ids[i] : 0;
              id(card_tiers)[i] = used && i < (int) tiers.size() ? tiers[i] : std::string("");
              id(card_titles)[i] = used ? titles[i] : std::string("");
            }
            id(more_count) = more;
        - script.execute: render_cards

    # Status bar: briefing items ready, and whether it's quiet hours.
    - action: set_status
      variables:
        briefing: int
        quiet: bool
      then:
        - lambda: |-
            id(briefing_count) = briefing;
            id(quiet_hours) = quiet;
        - script.execute: render_status
        - script.execute: apply_backlight   # the 25% floor follows quiet hours

    # Backlight level Feather wants (0 = off). A touch still wakes the screen locally for 30 s.
    - action: set_backlight
      variables:
        level: float
      then:
        - lambda: |-
            id(base_level) = level;
        - script.execute: apply_backlight

    # The LLM page (tap the status bar), pre-formatted by Feather (feather/gjallarhorn/cyd.py
    # llm_snapshot), plus the status-bar health glyph: 0 = hidden, 1 = amber, 2 = red.
    - action: set_llm
      variables:
        health: int
        reason: string
        model: string
        gpu: string
        vram_pct: int
        vram: string
        gen: string
        prefill: string
        reuse: string
        turns: string
      then:
        - lambda: |-
            id(llm_health) = health;
            lv_label_set_text(id(llm_model), model.c_str());
            lv_label_set_text(id(llm_gpu), gpu.c_str());
            lv_label_set_text(id(llm_vram), vram.c_str());
            lv_label_set_text(id(llm_gen), gen.c_str());
            lv_label_set_text(id(llm_prefill), prefill.c_str());
            lv_label_set_text(id(llm_reuse), reuse.c_str());
            lv_label_set_text(id(llm_turns), turns.c_str());
            lv_label_set_text(id(llm_reason), reason.c_str());
        - lvgl.bar.update:
            id: llm_vram_bar
            value: !lambda return vram_pct;
        - script.execute: render_health

    # Feather's GPU mode (feather/modes.py): 2 lights the button, busy greys it out.
    - action: set_mode
      variables:
        mode: int
        busy: bool
      then:
        - lambda: |-
            if (mode == 2) lv_obj_add_state(id(btn_mode), LV_STATE_CHECKED);
            else lv_obj_clear_state(id(btn_mode), LV_STATE_CHECKED);
            if (busy) lv_obj_add_state(id(btn_mode), LV_STATE_DISABLED);
            else lv_obj_clear_state(id(btn_mode), LV_STATE_DISABLED);

    # ---- pictures (feather/gjallarhorn/cyd.py show_image) ----------------------------------
    # Start: pause the touch UI and keep the screen lit for `seconds` (5-3600).
    - action: show_image_begin
      variables:
        seconds: int
      then:
        - lambda: |-
            id(image_mode) = true;
            id(image_drawn_at) = millis();
            int s = (int) seconds;
            uint32_t ms = (uint32_t) std::max(5, std::min(s, 3600)) * 1000;
            id(image_until) = millis() + ms;
            id(awake_until) = id(image_until);
        - lvgl.pause:
        - script.execute: apply_backlight

    # A strip of the picture: up to 8 full-width rows of big-endian RGB565, base64, starting at y.
    - action: show_image_rows
      variables:
        y: int
        data: string
      then:
        - lambda: |-
            if (!id(image_mode)) return;
            static uint8_t buf[320 * 8 * 2];
            size_t n = esphome::base64_decode(data, buf, sizeof(buf));
            int h = (int) (n / (320 * 2));
            if (h <= 0 || y < 0 || y + h > 240) return;
            id(tft_display).draw_pixels_at(0, y, 320, h, buf, display::COLOR_ORDER_RGB,
                                           display::COLOR_BITNESS_565, true, 0, 0, 0);
            id(image_drawn_at) = millis();

    - action: hide_image
      then:
        - script.execute: image_exit

    # Palette pushed from Feather's current web UI theme. Accepted so Feather's push still
    # succeeds, but ignored: this screen is fixed to the LCARS skin (see the header).
    - action: set_theme
      variables:
        bg: int
        surface: int
        border: int
        accent: int
        fg: int
        muted: int
      then:
        - logger.log:
            level: DEBUG
            format: "set_theme ignored - LCARS skin is fixed"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Schlafzimmer Fallback Hotspot
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Edmonton
    on_time_sync:
      then:
        - script.execute: render_status
        - script.execute: apply_backlight
    on_time:
      - seconds: 0
        then:
          - script.execute: render_status
      # The backlight floor's clock guard switches at 06:00 and 21:00.
      - seconds: 0
        minutes: 0
        hours: [6, 21]
        then:
          - script.execute: apply_backlight

# ============================================================
# State
# ============================================================
globals:
  - id: card_ids
    type: std::array<int, 3>
    restore_value: no
  - id: card_tiers
    type: std::array<std::string, 3>
    restore_value: no
  - id: card_titles
    type: std::array<std::string, 3>
    restore_value: no
  - id: more_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: briefing_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: quiet_hours
    type: bool
    restore_value: no
    initial_value: "false"
  - id: base_level            # what Feather asked for
    type: float
    restore_value: no
    initial_value: "0.6"
  - id: awake_until           # millis() until which a touch keeps the screen fully lit
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: finger_down           # set by on_touch, cleared by on_release
    type: bool
    restore_value: no
    initial_value: "false"
  - id: action_seq            # makes every feather_action value unique, so repeats still report
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_touch_report     # millis() of the last "touch" sent to Feather (throttle)
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: image_mode            # a picture is up (show_image_begin) - LVGL is paused
    type: bool
    restore_value: no
    initial_value: "false"
  - id: image_until           # millis() when it comes down on its own
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: image_drawn_at        # millis() of the last strip - touches just after it are ignored
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: llm_health            # 0 fine, 1 amber, 2 red (set_llm)
    type: int
    restore_value: no
    initial_value: "0"
  - id: current_page          # 0 ALERTS, 1 AIR, 2 SYSTEM
    type: int
    restore_value: no
    initial_value: "0"
  # Air trend history: 96 samples x 5 min = 8 h per metric (CO2, PM2.5, radiation, temp,
  # humidity), a ring buffer with aq_head = next slot to write. NAN = no reading at that time.
  - id: aq_hist
    type: std::array<std::array<float, 96>, 5>
    restore_value: no
  - id: aq_head
    type: int
    restore_value: no
    initial_value: "0"
  - id: aq_count
    type: int
    restore_value: no
    initial_value: "0"

# ============================================================
# Screen -> Feather: card taps and wake-ups, as a text sensor Feather subscribes to.
# Values look like "ack:42:7" / "dismiss:42:8" / "wake:0:9" (action:entry:sequence).
# ============================================================
text_sensor:
  - platform: template
    id: feather_action
    name: "Feather action"
    update_interval: never

# ============================================================
# Lights, sensors
# ============================================================
light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
  - platform: rgb
    id: led
    name: Status LED
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
  - {platform: ledc, pin: GPIO4,  id: output_red,   inverted: true}
  - {platform: ledc, pin: GPIO16, id: output_green, inverted: true}
  - {platform: ledc, pin: GPIO17, id: output_blue,  inverted: true}

sensor:
  # Light-dependent resistor on the front. Raw volts in, % out (calibration from the original
  # firmware: full dark 1.039 V with the backlight off, full light 0.075 V). Feather reads this to
  # pick a backlight level that's just visible in the room's current light.
  - platform: adc
    pin: GPIO34
    id: board_ldr
    update_interval: 1000ms
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10
  - platform: copy
    source_id: board_ldr
    name: "Ambient Light"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      # Only while the backlight is really off: lit, the LDR mostly sees the screen. With the
      # daytime 25% floor that's most of the day - Feather keeps the last dark reading instead
      # of a skewed one.
      - lambda: |-
          if (id(backlight).current_values.is_on()) return {};
          return x;
      - lambda: return min(max((100 - (((x - 0.075) / (1.039 - 0.075)) * 100)), 0.0), 100.0);
      # Heartbeat too: Feather only trusts readings taken a while after the backlight went off,
      # and with delta alone a steady dark room would never send another one.
      - or:
          - delta: 2.0
          - heartbeat: 60s

  # ---- office air, from Home Assistant (frame colour + header pill; see the header comment)
  - platform: homeassistant
    id: office_co2
    entity_id: sensor.co2_sensor_sco2_30_7292ac_scd30_co2
    internal: true
    on_value: [script.execute: render_aq]
  - platform: homeassistant
    id: office_pm25
    entity_id: sensor.geiger_counter_pm_25m
    internal: true
    on_value: [script.execute: render_aq]
  - platform: homeassistant
    id: office_rad
    entity_id: sensor.geiger_counter_radiation_level
    internal: true
    on_value: [script.execute: render_aq]
  - platform: homeassistant
    id: office_temp
    entity_id: sensor.timmerflotte_temp_hmd_sensor_temperature_2
    internal: true
    on_value: [script.execute: render_aq]
  - platform: homeassistant
    id: office_humidity
    entity_id: sensor.timmerflotte_temp_hmd_sensor_humidity_2
    internal: true
    on_value: [script.execute: render_aq]

binary_sensor:
  # The Geiger counter's own alarm - forces the radiation reading to "bad".
  - platform: homeassistant
    id: office_rad_warning
    entity_id: binary_sensor.geiger_counter_radiation_warning
    on_state: [script.execute: render_aq]
  # The ArmLight's state, from Home Assistant, so its button shows on/off.
  - platform: homeassistant
    id: armlight_on
    entity_id: light.armlight
    on_state:
      - lvgl.widget.update:
          id: btn_lamp
          state:
            checked: !lambda return x;

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(awake_until) != 0 && (int32_t) (millis() - id(awake_until)) >= 0) {
            id(awake_until) = 0;
            id(apply_backlight).execute();
          }
          if (id(image_mode) && (int32_t) (millis() - id(image_until)) >= 0) id(image_exit).execute();
  # Air trend sample every 5 minutes.
  - interval: 5min
    then:
      - lambda: |-
          float v[5] = {id(office_co2).state, id(office_pm25).state, id(office_rad).state,
                        id(office_temp).state, id(office_humidity).state};
          for (int m = 0; m < 5; m++) id(aq_hist)[m][id(aq_head)] = v[m];
          id(aq_head) = (id(aq_head) + 1) % 96;
          if (id(aq_count) < 96) id(aq_count)++;
      - script.execute: render_trends

# ============================================================
# Scripts
# ============================================================
script:
  - id: apply_backlight
    then:
      - lambda: |-
          bool awake = id(awake_until) != 0;
          float level = awake ? 1.0f : id(base_level);
          // Daytime floor: 25%, unless Feather says quiet hours or the clock says night (21-06).
          auto now = id(sntp_time).now();
          bool daytime = now.is_valid() && now.hour >= 6 && now.hour < 21;
          if (!id(quiet_hours) && daytime && level < 0.25f) level = 0.25f;
          auto call = level > 0.005f ? id(backlight).turn_on() : id(backlight).turn_off();
          if (level > 0.005f) call.set_brightness(level);
          call.perform();
          // While dark or dim, a full-screen catcher takes the first touch, so waking the screen
          // can never also press a button underneath it. It's put up at once but only taken down
          // after a delay (lower_catcher): removing it while the waking finger is still down let
          // that same press land on the card underneath and acknowledge it (found 2026-10-06).
          if (level < 0.35f) lv_obj_clear_flag(id(wake_catcher), LV_OBJ_FLAG_HIDDEN);
          else id(lower_catcher).execute();

  - id: lower_catcher
    mode: restart
    then:
      - delay: 250ms
      - lambda: |-
          bool lit = id(awake_until) != 0 || id(base_level) >= 0.35f;
          // finger_down is tracked from on_touch/on_release: the driver's get_touches() isn't
          // emptied on release, which kept the catcher up forever (every tap became a "wake").
          if (lit && !id(finger_down)) lv_obj_add_flag(id(wake_catcher), LV_OBJ_FLAG_HIDDEN);
          else if (lit) id(lower_catcher).execute();   // finger still down - try again shortly

  # Back from a picture to the notifications. The catcher goes up first, and lower_catcher only
  # takes it down once the finger has lifted - so a dismissing tap lands on the catcher, never on
  # a card or the desk buttons underneath.
  - id: image_exit
    then:
      - if:
          condition:
            lambda: return id(image_mode);
          then:
            - lambda: |-
                id(image_mode) = false;
                lv_obj_clear_flag(id(wake_catcher), LV_OBJ_FLAG_HIDDEN);
                id(feather_action).publish_state(str_sprintf("image_closed:0:%u", ++id(action_seq)));
            - script.execute: {id: goto_page, page: 0}
            - lvgl.resume:
            - lambda: lv_obj_invalidate(lv_layer_top());   # the shared frame was drawn over too
            - script.execute: lower_catcher

  - id: wake_screen
    then:
      - lambda: |-
          id(awake_until) = millis() + 30000;
          id(feather_action).publish_state(str_sprintf("wake:0:%u", ++id(action_seq)));
          id(apply_backlight).execute();

  - id: send_action
    parameters:
      action: string
      slot: int
    then:
      - lambda: |-
          int entry = id(card_ids)[slot];
          ESP_LOGI("feather", "card %d %s pressed (entry %d)", slot, action.c_str(), entry);
          if (entry == 0) return;
          // The touch panel can read noise while it starts up - nothing acts in the first 15 s.
          if (millis() < 15000) { ESP_LOGW("feather", "ignored - within 15 s of boot"); return; }
          id(feather_action).publish_state(str_sprintf("%s:%d:%u", action.c_str(), entry, ++id(action_seq)));
          id(awake_until) = millis() + 30000;   // stay lit while the person is using it

  - id: render_cards
    then:
      - lambda: |-
          lv_obj_t *cards[3] = {id(card0), id(card1), id(card2)};
          lv_obj_t *titles[3] = {id(card0_title), id(card1_title), id(card2_title)};
          lv_obj_t *tiers[3] = {id(card0_tier), id(card1_tier), id(card2_tier)};
          int shown = 0;
          for (int i = 0; i < 3; i++) {
            if (id(card_ids)[i] == 0) { lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN); continue; }
            shown++;
            lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(titles[i], id(card_titles)[i].c_str());
            const std::string &t = id(card_tiers)[i];
            lv_label_set_text(tiers[i], t.c_str());
            // Tier block colour: P0/P1 LCARS red, P2 tan, otherwise lilac.
            uint32_t col = (t == "P0" || t == "P1") ? 0xcc6666 : (t == "P2" ? 0xffcc66 : 0xcc99cc);
            lv_obj_set_style_bg_color(tiers[i], lv_color_hex(col), LV_PART_MAIN);
          }
          if (shown == 0) lv_obj_clear_flag(id(empty_label), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(empty_label), LV_OBJ_FLAG_HIDDEN);
      - script.execute: render_footer   # "+N" lives on the ALERTS segment

  - id: render_status
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          std::string clock = now.is_valid() ? now.strftime("%H:%M") : std::string("--:--");
          lv_label_set_text(id(clock_label), clock.c_str());
          auto utc = id(sntp_time).utcnow();
          std::string utc_clock = utc.is_valid() ? utc.strftime("%H:%M UTC") : std::string("--:-- UTC");
          lv_label_set_text(id(utc_label), utc_clock.c_str());
          std::string icons;
          if (id(quiet_hours)) icons += "\U000F0594";                    // mdi weather-night
          if (id(briefing_count) > 0) icons += "\U000F0219";             // mdi file-document
          lv_label_set_text(id(status_label), icons.c_str());
          std::string count = id(briefing_count) > 0 ? str_sprintf("%d", id(briefing_count)) : std::string("");
          lv_label_set_text(id(briefing_label), count.c_str());

  # Office readings: each AIR block (and its trend line) takes its own health colour; the frame
  # takes the worst of CO2 / PM2.5 / radiation on every page. Categories: -1 no data, 0 good,
  # 1 moderate, 2 poor, 3 bad.
  - id: render_aq
    then:
      - lambda: |-
          auto band = [](float v, float a, float b, float c) -> int {
            if (std::isnan(v)) return -1;
            return v < a ? 0 : v < b ? 1 : v < c ? 2 : 3;
          };
          // comfort ranges: inside [g0,g1] good, [m0,m1] moderate, [p0,p1] poor, else bad
          auto range = [](float v, float g0, float g1, float m0, float m1, float p0, float p1) -> int {
            if (std::isnan(v)) return -1;
            if (v >= g0 && v <= g1) return 0;
            if (v >= m0 && v <= m1) return 1;
            if (v >= p0 && v <= p1) return 2;
            return 3;
          };
          auto health = [](int c) -> uint32_t {
            static const uint32_t cols[] = {0x99cc99, 0xffcc66, 0xff9933, 0xcc6666};  // green tan orange red
            return c < 0 ? 0x9c9ca6 : cols[c];
          };
          float co2 = id(office_co2).state, pm = id(office_pm25).state, rad = id(office_rad).state;
          float t = id(office_temp).state, h = id(office_humidity).state;
          int cat[5] = {
            band(co2, 800, 1200, 2000),
            band(pm, 12, 35.5f, 55.5f),
            band(rad, 0.3f, 1.0f, 10.0f),
            range(t, 19, 24, 17, 26, 15, 28),
            range(h, 40, 60, 30, 65, 20, 70),
          };
          if (id(office_rad_warning).state) cat[2] = 3;
          // frame: worst air-health reading, lilac instead of green when healthy
          int worst = std::max(cat[0], std::max(cat[1], cat[2]));
          lv_color_t frame = lv_color_hex(worst == 0 ? 0xcc99cc : health(worst));
          lv_obj_set_style_img_recolor(id(elbow_top_img), frame, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(elbow_arm), frame, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(sidebar_top), frame, LV_PART_MAIN);
          // AIR page
          auto txt = [](float v, const char *fmt) {
            return std::isnan(v) ? std::string("--") : str_sprintf(fmt, v);
          };
          lv_obj_t *vals[5] = {id(air_co2_val), id(air_pm_val), id(air_rad_val), id(air_temp_val), id(air_hum_val)};
          lv_obj_t *blks[5] = {id(air_co2_blk), id(air_pm_blk), id(air_rad_blk), id(air_temp_blk), id(air_hum_blk)};
          LvLineType *lines[5] = {id(air_co2_line), id(air_pm_line), id(air_rad_line), id(air_temp_line), id(air_hum_line)};
          float v[5] = {co2, pm, rad, t, h};
          const char *fmt[5] = {"%.0f", "%.0f", "%.2f", "%.1f", "%.0f"};
          for (int m = 0; m < 5; m++) {
            lv_label_set_text(vals[m], txt(v[m], fmt[m]).c_str());
            lv_obj_set_style_bg_color(blks[m], lv_color_hex(health(cat[m])), LV_PART_MAIN);
            lv_obj_set_style_line_color(lines[m]->obj, lv_color_hex(health(cat[m])), LV_PART_MAIN);
          }

  # 8 h trend lines on the AIR page, oldest at the left, newest at the right edge. Each line is
  # scaled to its own min..max over the window (with a minimum span so noise stays flat); the
  # box's top-left/bottom-left labels give that max/min.
  - id: render_trends
    then:
      - lambda: |-
          const int W = 194, H = 36, N = 96, M = 5;
          const float min_span[M] = {200.0f, 10.0f, 0.1f, 2.0f, 10.0f};
          LvLineType *lines[M] = {id(air_co2_line), id(air_pm_line), id(air_rad_line), id(air_temp_line), id(air_hum_line)};
          lv_obj_t *his[M] = {id(air_co2_hi), id(air_pm_hi), id(air_rad_hi), id(air_temp_hi), id(air_hum_hi)};
          lv_obj_t *los[M] = {id(air_co2_lo), id(air_pm_lo), id(air_rad_lo), id(air_temp_lo), id(air_hum_lo)};
          const char *fmt[M] = {"%.0f", "%.0f", "%.2f", "%.1f", "%.0f"};
          int n = id(aq_count);
          for (int m = 0; m < M; m++) {
            float lo = NAN, hi = NAN;
            for (int j = 0; j < n; j++) {
              float v = id(aq_hist)[m][(id(aq_head) - n + j + N) % N];
              if (std::isnan(v)) continue;
              lo = std::isnan(lo) ? v : std::min(lo, v);
              hi = std::isnan(hi) ? v : std::max(hi, v);
            }
            std::vector<lv_point_t> pts;
            if (!std::isnan(lo) && n >= 2) {
              lv_label_set_text(his[m], str_sprintf(fmt[m], hi).c_str());
              lv_label_set_text(los[m], str_sprintf(fmt[m], lo).c_str());
              float span = hi - lo;
              if (span < min_span[m]) {
                float mid = (hi + lo) / 2;
                lo = mid - min_span[m] / 2;
                span = min_span[m];
              }
              for (int j = 0; j < n; j++) {
                float v = id(aq_hist)[m][(id(aq_head) - n + j + N) % N];
                if (std::isnan(v)) continue;
                lv_point_t pt;
                pt.x = (lv_coord_t) lroundf((W - 3) - (float) (n - 1 - j) * (W - 6) / (N - 1));
                pt.y = (lv_coord_t) lroundf(3 + (1.0f - (v - lo) / span) * (H - 6));
                pts.push_back(pt);
              }
            } else {
              lv_label_set_text(his[m], "");
              lv_label_set_text(los[m], "");
            }
            if (pts.size() < 2) pts.assign(2, lv_point_t{0, 0});
            lines[m]->set_points(pts);
          }

  # The glyph only shows when something on the LLM page needs a look; the reason line there
  # takes the same colour.
  - id: render_health
    then:
      - lambda: |-
          int h = id(llm_health);
          uint32_t col = h >= 2 ? 0xcc6666 : 0xffcc66;
          if (h > 0) {
            lv_obj_set_style_text_color(id(health_label), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(llm_reason), lv_color_hex(col), LV_PART_MAIN);
            lv_obj_clear_flag(id(health_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(llm_reason), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(health_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(llm_reason), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: render_footer

  # Paging from the footer: 0 ALERTS, 1 AIR, 2 SYSTEM. AIR/SYSTEM fall back to ALERTS after 60 s.
  - id: goto_page
    parameters:
      page: int
    then:
      - lambda: id(current_page) = page;
      - if:
          condition:
            lambda: return page == 1;
          then:
            - lvgl.page.show: air_page
            - script.execute: render_trends
          else:
            - if:
                condition:
                  lambda: return page == 2;
                then:
                  - lvgl.page.show: llm_page
                else:
                  - lvgl.page.show: main_page
      - script.execute: render_footer
      - if:
          condition:
            lambda: return page != 0;
          then:
            - script.execute: page_timeout
          else:
            - script.stop: page_timeout

  - id: page_timeout
    mode: restart
    then:
      - delay: 60s
      - script.execute: {id: goto_page, page: 0}

  # Footer segments: the current page lit orange, others mauve - except SYSTEM, which shows the
  # LLM health (tan / red) when it isn't the current page. ALERTS carries the "+N" overflow count.
  # The header's title pill names the page.
  - id: render_footer
    then:
      - lambda: |-
          lv_obj_t *segs[3] = {id(foot_alerts), id(foot_air), id(foot_system)};
          int pg = id(current_page);
          for (int i = 0; i < 3; i++) {
            uint32_t col = (i == pg) ? 0xff9933 : 0xa366a3;
            if (i == 2 && i != pg && id(llm_health) > 0) col = id(llm_health) >= 2 ? 0xcc6666 : 0xffcc66;
            lv_obj_set_style_bg_color(segs[i], lv_color_hex(col), LV_PART_MAIN);
          }
          std::string alerts = id(more_count) > 0 ? str_sprintf("ALERTS +%d", id(more_count)) : std::string("ALERTS");
          lv_label_set_text(id(foot_alerts_label), alerts.c_str());
          static const char *titles[3] = {"ALERTS", "OFFICE AIR 8H", "SYSTEM"};
          lv_label_set_text(id(title_label), titles[pg]);

# ============================================================
# Display + touch
# ============================================================
spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: tft_display
    model: ili9341
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    color_palette: 8BIT      # the board has no PSRAM - LVGL draws through its own smaller buffer
    dimensions:
      width: 320
      height: 240
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  platform: xpt2046
  id: tft_touch
  spi_id: touch
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  threshold: 400
  calibration:
    x_min: 180
    x_max: 3800
    y_min: 240
    y_max: 3860
  transform:
    swap_xy: true
    # The original firmware drew its grid mirrored relative to touch (its "3 - col"), i.e. touch
    # X runs opposite to display X. CHECK ON FIRST BOOT: if taps land on the wrong side, flip this.
    mirror_x: true
    # Touch Y was upside down relative to the display (2026-10-10): taps on a top card's "Got it"
    # (y ~70) arrived at y ~170, so card buttons never fired and desk Stand/Sit were swapped. The
    # lamp, dead centre vertically, was the only control that worked either way.
    mirror_y: true
  on_release:
    then:
      - lambda: id(finger_down) = false;
  on_touch:
    then:
      - lambda: |-
          id(finger_down) = true;
          ESP_LOGI("touch", "touch x=%d y=%d (raw %d,%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);
      # A tap takes a picture down - but not while it's drawing or just after: streaming 150 KB
      # to the panel makes the XPT2046 read a phantom press near the middle (raw ~2000/2000,
      # z just over threshold), which took every picture down the moment it finished (2026-10-19).
      - if:
          condition:
            lambda: |-
              if (!id(image_mode)) return false;
              if (millis() - id(image_drawn_at) < 1500) {
                ESP_LOGD("feather", "touch ignored - picture drawing");
                return false;
              }
              return true;
          then:
            - script.execute: image_exit
      - if:
          condition:
            lambda: return id(awake_until) == 0 && id(base_level) < 0.35f;
          then:
            - script.execute: wake_screen
          else:
            # Already lit: someone's using it. Keep a local wake going, and tell Feather (at most
            # every 5 s) so its idle timeout restarts too - desk/lamp/blank-area taps send nothing
            # else, and the screen used to go dark mid-use.
            - lambda: |-
                if (id(awake_until) != 0) id(awake_until) = millis() + 30000;
                if (millis() < 15000) return;   // touch noise while the panel starts up
                if (id(last_touch_report) != 0 && millis() - id(last_touch_report) < 5000) return;
                id(last_touch_report) = millis();
                id(feather_action).publish_state(str_sprintf("touch:0:%u", ++id(action_seq)));

# ============================================================
# Fonts: Antonio (the LCARS face Feather's web UI uses) for text; Material Design Icons for the
# buttons/status.
# ============================================================
font:
  - file: "gfonts://Antonio@700"
    id: antonio_b16
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Antonio@700"
    id: antonio_b14
    size: 14
    bpp: 4
    glyphs: " +-./%0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Antonio@700"
    id: antonio_b22
    size: 22
    bpp: 4
    glyphs: "0123456789.-"
  - file: "gfonts://Antonio@400"
    id: antonio_15
    size: 15
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Antonio@400"
    id: antonio_13
    size: 13
    bpp: 4
    glyphs: " +-:.,/%0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz()"
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_36
    size: 36
    bpp: 4
    glyphs: ["\U000F0CE1", "\U000F0CDB", "\U000F06B5", "\U000F0174"]   # arrow-up-bold-box, arrow-down-bold-box, lamp, code-tags
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_14
    size: 14
    bpp: 4
    glyphs: ["\U000F0594", "\U000F0219", "\U000F0028"]   # weather-night, file-document, alert-circle (icons only - no space/digits in this font)

# LCARS elbow corners (art/make_frame.py): alpha masks, tinted with image_recolor.
image:
  - file: art/elbow_top.png
    id: elbow_top_mask
    type: GRAYSCALE
    transparency: alpha_channel
  - file: art/elbow_bottom.png
    id: elbow_bottom_mask
    type: GRAYSCALE
    transparency: alpha_channel

# ============================================================
# LVGL layout - 320x240 landscape, LCARS.
#   top layer (every page): header row 0..18 with the elbow (AQ colour), clock, UTC, status
#     icons and the page title pill; left sidebar x 0..12 curving into the footer y 214..240
#     (ALERTS / AIR / SYSTEM page buttons, then a tan end cap); the wake catcher above it all.
#   pages draw only inside x 16..318, y 22..210.
# ============================================================
lvgl:
  displays: [tft_display]
  touchscreens: [tft_touch]
  buffer_size: 25%
  color_depth: 16
  # LVGL is only ever paused while a picture is up (show_image_begin). Its default resume_on_input
  # would un-pause on any touch - including the phantom one the panel reads while a picture streams
  # in - and repaint the notifications over the picture. Only image_exit resumes it.
  resume_on_input: false
  default_font: antonio_15
  style_definitions:
    - id: frame_style         # elbow / sidebar / footer blocks
      bg_opa: COVER
      border_width: 0
      shadow_width: 0
      pad_all: 0
    - id: card_style
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 4
    - id: side_btn_style
      # LCARS pill: fully rounded ends. 66x44 (XPT2046 is jittery - keep targets big).
      bg_opa: COVER
      border_width: 0
      radius: 22
      shadow_width: 0
    - id: small_btn_style
      # Big targets: LVGL drops a click whose press and release don't land on the same object -
      # text-sized buttons lost most taps.
      bg_opa: COVER
      border_width: 0
      radius: 14
      shadow_width: 0
      pad_all: 0
    - id: foot_btn_style      # footer segment: square ends, label bottom-right, LCARS style
      bg_opa: COVER
      border_width: 0
      radius: 0
      shadow_width: 0
      pad_all: 0
      bg_color: 0xa366a3

  top_layer:
    scrollable: false
    widgets:
      # ---- frame: elbow, sidebar (upper segment AQ colour), bottom elbow
      - image: {id: elbow_top_img, src: elbow_top_mask, x: 0, y: 0, image_recolor: 0x9c9ca6, image_recolor_opa: COVER, clickable: false}
      - obj: {id: elbow_arm, styles: frame_style, x: 40, y: 0, width: 34, height: 18, radius: 0, bg_color: 0x9c9ca6, clickable: false}
      - obj: {id: sidebar_top, styles: frame_style, x: 0, y: 40, width: 12, height: 88, radius: 0, bg_color: 0x9c9ca6, clickable: false}
      - obj: {id: sidebar_bottom, styles: frame_style, x: 0, y: 132, width: 12, height: 68, radius: 0, bg_color: 0x9c9ca6, clickable: false}
      - image: {id: elbow_bottom_img, src: elbow_bottom_mask, x: 0, y: 200, image_recolor: 0x9c9ca6, image_recolor_opa: COVER, clickable: false}

      # ---- header
      - label:
          id: clock_label
          x: 4
          y: 0
          width: 66
          text_align: RIGHT
          text_font: antonio_b16
          text: "--:--"
          text_color: 0x000000
      - label:
          id: utc_label
          x: 80
          y: 2
          text: "--:-- UTC"
          text_font: antonio_13
          text_color: 0x9c9ca6
      - label:
          id: health_label          # LLM health - hidden unless something needs a look
          x: 130
          y: 2
          text_font: mdi_14
          text: "\U000F0028"
          text_color: 0xffcc66
          hidden: true
      - label:
          id: status_label
          x: 142
          y: 2
          width: 60
          text_align: RIGHT
          text_font: mdi_14
          text: ""
          text_color: 0x9c9ca6
      - label:
          id: briefing_label
          x: 205
          y: 0
          width: 20
          text: ""
          text_font: antonio_b16
          text_color: 0xffcc66
      - obj:
          styles: frame_style
          x: 228
          y: 0
          width: 90
          height: 18
          radius: 9
          bg_color: 0xcc99cc
          scrollable: false
          clickable: false
          widgets:
            - label: {id: title_label, align: CENTER, text: "ALERTS", text_font: antonio_b16, text_color: 0x000000}

      # ---- footer: page buttons, then the end cap
      - button:
          id: foot_alerts
          styles: foot_btn_style
          bg_color: 0xff9933
          x: 44
          y: 214
          width: 70
          height: 26
          widgets: [label: {id: foot_alerts_label, align: BOTTOM_RIGHT, x: -4, y: -2, text: "ALERTS", text_font: antonio_b14, text_color: 0x000000}]
          on_click: [script.execute: {id: goto_page, page: 0}]
      - button:
          id: foot_air
          styles: foot_btn_style
          x: 118
          y: 214
          width: 70
          height: 26
          widgets: [label: {align: BOTTOM_RIGHT, x: -4, y: -2, text: "AIR", text_font: antonio_b14, text_color: 0x000000}]
          on_click: [script.execute: {id: goto_page, page: 1}]
      - button:
          id: foot_system
          styles: foot_btn_style
          x: 192
          y: 214
          width: 70
          height: 26
          widgets: [label: {align: BOTTOM_RIGHT, x: -4, y: -2, text: "SYSTEM", text_font: antonio_b14, text_color: 0x000000}]
          on_click: [script.execute: {id: goto_page, page: 2}]
      - obj: {styles: frame_style, x: 266, y: 214, width: 54, height: 26, radius: 13, bg_color: 0xffcc66, clickable: false}
      - obj: {styles: frame_style, x: 266, y: 214, width: 20, height: 26, radius: 0, bg_color: 0xffcc66, clickable: false}

      # ---- invisible full-screen catcher, only shown while the screen is dark/dim (last = on top)
      - obj:
          id: wake_catcher
          x: 0
          y: 0
          width: 320
          height: 240
          bg_opa: TRANSP
          border_width: 0
          hidden: true
          on_click:
            # Already awake: just get out of the way so the next tap reaches the buttons.
            # (Re-waking here restarted the catcher's countdown, so quick taps after a wake
            # kept landing on the catcher - Dismiss took several tries.)
            - lambda: |-
                if (id(awake_until) != 0) lv_obj_add_flag(id(wake_catcher), LV_OBJ_FLAG_HIDDEN);
                else id(wake_screen).execute();

  pages:
    # ---- ALERTS: notification cards + the side column
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      widgets:
        - label:
            id: empty_label
            x: 16
            y: 106
            width: 228
            text_align: CENTER
            text: "NOTHING WAITING ON YOU"
            text_color: 0x9c9ca6

        - obj:
            id: card0
            styles: card_style
            x: 16
            y: 22
            width: 228
            height: 60
            hidden: true
            scrollable: false
            widgets:
              - label: {id: card0_tier, x: 0, y: 0, width: 24, height: 52, radius: 6, bg_opa: COVER, bg_color: 0xcc99cc, pad_top: 4, text_align: CENTER, text: "", text_font: antonio_b16, text_color: 0x000000}
              - label: {id: card0_title, x: 30, y: 0, width: 190, height: 20, long_mode: DOT, text: "", text_color: 0xffcc66}
              - button:
                  id: card0_ack
                  styles: small_btn_style
                  bg_color: 0xcc99cc
                  x: 30
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "GOT IT", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "ack", slot: 0}]
              - button:
                  id: card0_dismiss
                  styles: small_btn_style
                  bg_color: 0x9c9ca6
                  x: 126
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "DISMISS", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "dismiss", slot: 0}]
        - obj:
            id: card1
            styles: card_style
            x: 16
            y: 84
            width: 228
            height: 60
            hidden: true
            scrollable: false
            widgets:
              - label: {id: card1_tier, x: 0, y: 0, width: 24, height: 52, radius: 6, bg_opa: COVER, bg_color: 0xcc99cc, pad_top: 4, text_align: CENTER, text: "", text_font: antonio_b16, text_color: 0x000000}
              - label: {id: card1_title, x: 30, y: 0, width: 190, height: 20, long_mode: DOT, text: "", text_color: 0xffcc66}
              - button:
                  id: card1_ack
                  styles: small_btn_style
                  bg_color: 0xcc99cc
                  x: 30
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "GOT IT", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "ack", slot: 1}]
              - button:
                  id: card1_dismiss
                  styles: small_btn_style
                  bg_color: 0x9c9ca6
                  x: 126
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "DISMISS", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "dismiss", slot: 1}]
        - obj:
            id: card2
            styles: card_style
            x: 16
            y: 146
            width: 228
            height: 60
            hidden: true
            scrollable: false
            widgets:
              - label: {id: card2_tier, x: 0, y: 0, width: 24, height: 52, radius: 6, bg_opa: COVER, bg_color: 0xcc99cc, pad_top: 4, text_align: CENTER, text: "", text_font: antonio_b16, text_color: 0x000000}
              - label: {id: card2_title, x: 30, y: 0, width: 190, height: 20, long_mode: DOT, text: "", text_color: 0xffcc66}
              - button:
                  id: card2_ack
                  styles: small_btn_style
                  bg_color: 0xcc99cc
                  x: 30
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "GOT IT", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "ack", slot: 2}]
              - button:
                  id: card2_dismiss
                  styles: small_btn_style
                  bg_color: 0x9c9ca6
                  x: 126
                  y: 24
                  width: 92
                  height: 28
                  widgets: [label: {text: "DISMISS", align: CENTER, text_font: antonio_b14, text_color: 0x000000}]
                  on_click: [script.execute: {id: send_action, action: "dismiss", slot: 2}]

        # ---- the side column: desk stand / ArmLight / desk sit through Home Assistant, then GPU mode
        - button:
            id: btn_stand
            styles: side_btn_style
            bg_color: 0xff9933
            x: 250
            y: 22
            width: 66
            height: 44
            widgets:
              - label: {id: btn_stand_icon, align: CENTER, text_font: mdi_36, text: "\U000F0CE1", text_color: 0x000000}
            on_click:
              - homeassistant.action:
                  action: script.setdeskstanding
        - button:
            id: btn_lamp
            styles: side_btn_style
            bg_color: 0x9c9ca6          # off: grey; on: tan
            checked:
              bg_color: 0xffcc66
            x: 250
            y: 69
            width: 66
            height: 44
            checkable: true
            widgets:
              - label: {id: btn_lamp_icon, align: CENTER, text_font: mdi_36, text: "\U000F06B5", text_color: 0x000000}
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.armlight
        - button:
            id: btn_sit
            styles: side_btn_style
            bg_color: 0xff9933
            x: 250
            y: 116
            width: 66
            height: 44
            widgets:
              - label: {id: btn_sit_icon, align: CENTER, text_font: mdi_36, text: "\U000F0CDB", text_color: 0x000000}
            on_click:
              - homeassistant.action:
                  action: script.setdesksitting
        # Not checkable: only set_mode lights it, so it can't disagree with what Feather is running.
        - button:
            id: btn_mode
            styles: side_btn_style
            bg_color: 0xa366a3          # daily: mauve; coding: tan; switching: dark grey
            checked:
              bg_color: 0xffcc66
            disabled:
              bg_color: 0x444448
            x: 250
            y: 163
            width: 66
            height: 44
            widgets:
              - label: {id: btn_mode_icon, align: CENTER, text_font: mdi_36, text: "\U000F0174", text_color: 0x000000}
            on_click:
              - lambda: |-
                  // The touch panel can read noise while it starts up - same guard as the cards.
                  if (millis() < 15000) return;
                  id(feather_action).publish_state(str_sprintf("mode:0:%u", ++id(action_seq)));
                  id(awake_until) = millis() + 30000;

