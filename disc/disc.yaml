# Disc - Guition JC3636W518 V2 ("Taichi Pi" v2), 1.8" round 360x360, ESP32-S3 N16R8.
#
# Clean rewrite (2026-11-05) replacing the RealDeco/xiaozhi-esphome "Taichi Pi v2" build that was
# on the device: stock ESPHome components only, no git packages, no runtime image downloads (the
# old build blocked the main loop ~3.7 s per 214 KB wallpaper fetch, which made Home Assistant's
# API handshake time out), and no fake battery widget (this unit has no battery).
#
# Hardware notes (pins verified from the running device's config dump):
#   display   QSPI CLK 9, D0-D3 11/12/13/14, CS 10, RST 47, backlight PWM GPIO15
#   touch     CST816 @ 0x15 on I2C SDA 7 / SCL 8, INT 41, RST 40
#   mic       single PDM mic, CLK 45, DATA 46
#   audio out I2S LRCLK 16 / BCLK 18 / MCLK 21 / DOUT 17, amp enable GPIO48
#             -> NO built-in speaker: sound comes out of the 3.5 mm jack only
#
# Behaviour:
#   - wake word on-device (microWakeWord: "Okay Nabu", "Hey Jarvis"), or tap the screen to talk
#   - tap while it's talking/listening stops it; tap while a timer rings silences it
#   - ring around the edge shows the phase: grey idle, blue listening, amber thinking,
#     green replying, red error, dark red muted, purple timer ringing
#   - screen dims after 2 min without activity
#
# Build: esphome 2026.10.2 (see secrets.yaml next to this file, gitignored).

substitutions:
  name: disc
  friendly_name: Disc

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_phase
          phase: "no_ha"
      - script.execute: activity

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # Yoda preferred, AlienAbduction backup. Keep the priorities only 1 apart: ESPHome lowers a
  # network's priority by 1 per failed round, so a big gap (it was 10) means a bad Yoda password
  # keeps it retrying Yoda for minutes instead of falling back.
  networks:
    - ssid: !secret yoda_ssid
      password: !secret yoda_password
      priority: 1
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 0
  ap:
    ssid: "Disc Fallback"
    password: !secret ap_password

captive_portal:

# Reset reason + uptime, so a crash loop shows up in HA instead of needing a USB cable.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
  - platform: wifi_info
    ip_address:
      name: IP address
    ssid:
      name: SSID

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Heap free
    loop_time:
      name: Loop time

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: draw_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: draw_clock

globals:
  - id: current_phase
    type: std::string
    initial_value: '"no_ha"'
  - id: timer_ringing
    type: bool
    initial_value: "false"

# --- AUDIO --------------------------------------------------------------------

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO42
  - id: i2s_out
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO21

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO46
    adc_type: external
    pdm: true
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: stereo
    buffer_duration: 300ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

  - platform: resampler
    id: media_resampling_input
    output_speaker: media_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input
    sample_rate: 48000

media_player:
  - platform: speaker
    id: disc_media
    name: Media player
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.9
    buffer_size: 250000
    announcement_pipeline:
      speaker: announcement_resampling_input
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_input
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    files:
      - id: wake_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: timer_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac

switch:
  # Amplifier enable for the 3.5 mm output.
  - platform: gpio
    id: speaker_enable
    name: Speaker enable
    icon: mdi:speaker
    entity_category: config
    pin: GPIO48
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mute
    name: Mute microphone
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - script.execute:
          id: set_phase
          phase: "muted"
    on_turn_off:
      - script.execute: start_wake_word
      - script.execute:
          id: set_phase
          phase: "idle"

  - platform: template
    id: wake_sound_enabled
    name: Wake sound
    icon: mdi:bullhorn
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# --- VOICE --------------------------------------------------------------------

micro_wake_word:
  id: mww
  microphone: box_mic
  vad:
  models:
    - model: okay_nabu
    - model: hey_jarvis
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: wake_sound_enabled
        then:
          - media_player.speaker.play_on_device_media_file:
              media_file: wake_sound
              announcement: true
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: disc_media
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
          - script.execute:
              id: set_phase
              phase: "idle"
        else:
          - script.execute:
              id: set_phase
              phase: "muted"
  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - script.execute:
        id: set_phase
        phase: "no_ha"
  on_listening:
    - lvgl.label.update:
        id: text_label
        text: ""
    - script.execute:
        id: set_phase
        phase: "listening"
  on_stt_vad_end:
    - script.execute:
        id: set_phase
        phase: "thinking"
  on_stt_end:
    - lvgl.label.update:
        id: text_label
        text: !lambda return x;
  on_tts_start:
    - lvgl.label.update:
        id: text_label
        text: !lambda return x;
    - script.execute:
        id: set_phase
        phase: "replying"
  on_error:
    - lvgl.label.update:
        id: text_label
        text: !lambda return message;
    - script.execute:
        id: set_phase
        phase: "error"
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          lambda: return id(current_phase) == "error";
        then:
          - delay: 3s
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
          - script.execute:
              id: set_phase
              phase: "idle"
  on_timer_started:
    - lvgl.label.update:
        id: text_label
        text: "Timer started"
  on_timer_finished:
    - lambda: id(timer_ringing) = true;
    - script.execute:
        id: set_phase
        phase: "timer"
    - script.execute: ring_timer

script:
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

  # Ring until tapped, up to ~5 minutes.
  - id: ring_timer
    mode: restart
    then:
      - repeat:
          count: 100
          then:
            - if:
                condition:
                  lambda: return !id(timer_ringing);
                then:
                  - script.stop: ring_timer
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_sound
                announcement: true
            - delay: 3s
      - script.execute: stop_timer

  - id: stop_timer
    then:
      - lambda: id(timer_ringing) = false;
      - media_player.stop:
          id: disc_media
          announcement: true
      - lvgl.label.update:
          id: text_label
          text: ""
      - script.execute:
          id: set_phase
          phase: !lambda 'return id(mute).state ? std::string("muted") : std::string("idle");'

  # Ring colour + status text for each phase; any phase except idle/no_ha wakes the screen.
  - id: set_phase
    parameters:
      phase: string
    then:
      - lambda: |-
          id(current_phase) = phase;
          uint32_t color = 0x303030;
          const char *status = "";
          if (phase == "idle")           { color = 0x303030; status = "Say \"Okay Nabu\""; }
          else if (phase == "listening") { color = 0x2196F3; status = "Listening..."; }
          else if (phase == "thinking")  { color = 0xFFA000; status = "Thinking..."; }
          else if (phase == "replying")  { color = 0x4CAF50; status = ""; }
          else if (phase == "error")     { color = 0xF44336; status = "Error"; }
          else if (phase == "muted")     { color = 0x8B0000; status = "Muted"; }
          else if (phase == "timer")     { color = 0xE040FB; status = "Timer! Tap to stop"; }
          else if (phase == "no_ha")     { color = 0x555555; status = "Waiting for Home Assistant"; }
          lv_obj_set_style_border_color(id(ring), lv_color_hex(color), LV_PART_MAIN);
          lv_label_set_text(id(status_label), status);
      - if:
          condition:
            lambda: return id(current_phase) != "idle" && id(current_phase) != "no_ha";
          then:
            - script.execute: activity

  # Full brightness now, dim after 2 minutes of nothing happening.
  - id: activity
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
          transition_length: 200ms
      - delay: 120s
      - light.turn_on:
          id: backlight
          brightness: 15%
          transition_length: 2s

  - id: draw_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          lv_label_set_text(id(time_label), now.strftime("%H:%M").c_str());
          lv_label_set_text(id(date_label), now.strftime("%a %b %d").c_str());

# --- DISPLAY + TOUCH ----------------------------------------------------------

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO9
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

i2c:
  id: touch_bus
  sda: GPIO7
  scl: GPIO8

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO15

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    icon: mdi:television
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: touch_bus
    interrupt_pin: GPIO41
    reset_pin: GPIO40
    display: main_display
    on_release:
      - if:
          # A dim screen's first tap only wakes it.
          condition:
            lambda: return id(backlight).current_values.get_brightness() < 0.5f;
          then:
            - script.execute: activity
          else:
            - script.execute: activity
            - if:
                condition:
                  lambda: return id(timer_ringing);
                then:
                  - script.execute: stop_timer
                else:
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - voice_assistant.stop:
                      else:
                        - if:
                            condition:
                              and:
                                - switch.is_off: mute
                                - api.connected:
                            then:
                              - media_player.stop:
                                  id: disc_media
                              - voice_assistant.start:

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: font_time
    size: 92
    glyphs: "0123456789:-"
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_small
    size: 22
    glyphsets: [GF_Latin_Core]

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 100%
  rotation: 180
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      widgets:
        - obj:
            id: ring
            align: CENTER
            width: 360
            height: 360
            radius: 180
            bg_opa: TRANSP
            border_width: 10
            border_color: 0x555555
            clickable: false
        - label:
            id: status_label
            align: TOP_MID
            y: 62
            text_font: font_small
            text_color: 0x9E9E9E
            text: "Waiting for Home Assistant"
        - label:
            id: time_label
            align: CENTER
            y: -18
            text_font: font_time
            text_color: 0xFFFFFF
            text: "--:--"
        - label:
            id: date_label
            align: CENTER
            y: 42
            text_font: font_small
            text_color: 0xBDBDBD
            text: ""
        - label:
            id: text_label
            align: TOP_MID
            y: 238
            width: 250
            long_mode: DOT
            height: 60
            text_align: CENTER
            text_font: font_small
            text_color: 0xFFFFFF
            text: ""
