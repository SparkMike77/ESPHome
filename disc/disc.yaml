# Disc - Guition JC3636W518 V2 ("Taichi Pi" v2), 1.8" round 360x360, ESP32-S3 N16R8.
#
# Clean rewrite (2026-11-05) replacing the RealDeco/xiaozhi-esphome "Taichi Pi v2" build that was
# on the device: stock ESPHome components only, no git packages, no runtime image downloads (the
# old build blocked the main loop ~3.7 s per 214 KB wallpaper fetch, which made Home Assistant's
# API handshake time out), and no fake battery widget (this unit has no battery).
#
# Hardware notes (pins verified from the running device's config dump):
#   display   QSPI CLK 9, D0-D3 11/12/13/14, CS 10, RST 47, backlight PWM GPIO15
#   touch     CST816 @ 0x15 on I2C SDA 7 / SCL 8, INT 41, RST 40
#   mic       single PDM mic, CLK 45, DATA 46
#   audio out I2S LRCLK 16 / BCLK 18 / MCLK 21 / DOUT 17, amp enable GPIO48
#             -> NO built-in speaker: sound comes out of the 3.5 mm jack only
#
# Behaviour:
#   - wake word on-device (microWakeWord: "Hey Jarvis", "Okay Nabu" - which one is active is
#     HA's Wake word select, and the idle screen shows whichever is selected), or tap to talk
#   - tap while it's talking/listening stops it; tap while a timer rings silences it
#   - screen is the centre disc of the Eye of Agamotto (the enclosure supplies the gold frame):
#     listening = bands turn part-way and the eye opens (green stone), thinking = yellow pulse,
#     replying = green, error = red, timer = purple; done = eye closes and bands turn back
#   - "Show text" switch in HA: wake word prompt / clock / transcript over the eye, or off
#   - screen dims after 2 min without activity
#   - needs a solid USB supply: on the wireless/MagSafe puck it browns out (power-on reset) when
#     a reply starts playing
#
# Build: esphome 2026.10.2 (see secrets.yaml next to this file, gitignored). Run
# art/make_eye.py first - the eye frames it makes are gitignored, so a fresh clone won't build
# without art/source/eye.png.

substitutions:
  name: disc
  friendly_name: Disc

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  on_boot:
    priority: -100
    then:
      - script.execute:
          id: set_phase
          phase: "no_ha"
      - script.execute: activity

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key
  actions:
    # Spin the eye for 8 s without talking to it (HA: esphome.disc_eye_demo). For tuning the
    # animation's frame time; harmless to leave in.
    - action: eye_demo
      then:
        - script.execute:
            id: set_phase
            phase: "thinking"
        - delay: 8s
        - script.execute:
            id: set_phase
            phase: !lambda 'return id(mute).state ? std::string("muted") : std::string("idle");'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  # Yoda preferred, AlienAbduction backup. Keep the priorities only 1 apart: ESPHome lowers a
  # network's priority by 1 per failed round, so a big gap (it was 10) means a bad Yoda password
  # keeps it retrying Yoda for minutes instead of falling back.
  networks:
    - ssid: !secret yoda_ssid
      password: !secret yoda_password
      priority: 1
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 0
  ap:
    ssid: "Disc Fallback"
    password: !secret ap_password

captive_portal:

# Reset reason + uptime, so a crash loop shows up in HA instead of needing a USB cable.
debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
  - platform: wifi_info
    ip_address:
      name: IP address
    ssid:
      name: SSID

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Heap free
    loop_time:
      name: Loop time

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: draw_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: draw_clock

globals:
  - id: current_phase
    type: std::string
    initial_value: '"no_ha"'
  - id: timer_ringing
    type: bool
    initial_value: "false"
  # Idle prompt, built from whichever wake word(s) HA's Wake word select has enabled.
  - id: idle_prompt
    type: std::string
    initial_value: '"Tap to talk"'
  # Eye animation targets, set per phase by set_phase and chased by the 33 ms frame player.
  # eye_target: 0 = closed + bands aligned, 1 = bands turned + eye open.
  # eye_variant (only shown once fully open): 0 green, 1 yellow pulse, 2 red, 3 purple.
  - id: eye_target
    type: float
    initial_value: "0"
  - id: eye_variant
    type: int
    initial_value: "0"

# HA enables/disables the on-device models through the satellite configuration with no
# trigger for it, so check every 2 s and refresh the idle prompt when it changes.
interval:
  - interval: 2s
    then:
      - lambda: |-
          std::string words;
          for (auto *model : id(mww)->get_wake_words()) {
            if (!model->is_enabled()) continue;
            if (!words.empty()) words += "\" or \"";
            words += model->get_wake_word();
          }
          std::string prompt = words.empty() ? std::string("Tap to talk") : "Say \"" + words + "\"";
          if (prompt == id(idle_prompt)) return;
          id(idle_prompt) = prompt;
          if (id(current_phase) == "idle") lv_label_set_text(id(status_label), prompt.c_str());

  # Eye of Agamotto frame player. Every frame is pre-rendered (art/make_eye.py) because the
  # device took 120-225 ms to rotate layers itself; swapping a full-screen picture is cheap.
  # Opening plays f00 -> f13 (bands turn, then lids part); closing plays it backwards. Once
  # open, a colour variant can replace the last frame. Settled = no LVGL calls at all.
  - interval: 33ms
    then:
      - lambda: |-
          static image::Image *frames[] = {
            id(eye_f00), id(eye_f01), id(eye_f02), id(eye_f03), id(eye_f04), id(eye_f05), id(eye_f06),
            id(eye_f07), id(eye_f08), id(eye_f09), id(eye_f10), id(eye_f11), id(eye_f12), id(eye_f13)};
          const int N = sizeof(frames) / sizeof(frames[0]);
          static float t = 0;
          static int shown = 0;             // 0..N-1 frame, 100+ = variant image
          const float step = 0.033f / 0.55f;  // whole open/close takes ~0.55 s
          float goal = id(eye_target);
          if (t < goal) t = std::min(goal, t + step);
          else if (t > goal) t = std::max(goal, t - step);
          int want = (int) lroundf(t * (N - 1));
          image::Image *src = frames[want];
          if (want == N - 1 && id(eye_variant) != 0) {
            switch (id(eye_variant)) {
              case 1: {  // processing: alternate two yellows for a slow pulse
                bool bright = (millis() / 600) % 2;
                want = bright ? 102 : 101;
                src = bright ? id(eye_yellow2) : id(eye_yellow);
                break;
              }
              case 2: want = 103; src = id(eye_red); break;
              case 3: want = 104; src = id(eye_purple); break;
            }
          }
          if (want == shown) return;
          lv_image_set_src(id(eye_w), src->get_lv_image_dsc());
          shown = want;

# --- AUDIO --------------------------------------------------------------------

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO42
  - id: i2s_out
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO18
    i2s_mclk_pin: GPIO21

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO46
    adc_type: external
    pdm: true
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: stereo
    buffer_duration: 300ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

  - platform: resampler
    id: media_resampling_input
    output_speaker: media_mixer_input
    sample_rate: 48000

  - platform: resampler
    id: announcement_resampling_input
    output_speaker: announcement_mixer_input
    sample_rate: 48000

media_player:
  - platform: speaker
    id: disc_media
    name: Media player
    volume_increment: 0.05
    # Capped at 50% output (HA's 100% = 0.5) to keep the reply-start power spike down on the
    # wireless puck; raise volume_max if an external amp takes over the load.
    volume_min: 0.2
    volume_max: 0.5
    buffer_size: 250000
    announcement_pipeline:
      speaker: announcement_resampling_input
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_input
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    # Wake chime removed (2026-11-06) so it doesn't stack on the wake-up power spike. To bring it
    # back: add wake_word_triggered.flac here and play it in micro_wake_word's on_wake_word_detected.
    files:
      - id: timer_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac

switch:
  # Amplifier enable for the 3.5 mm output.
  - platform: gpio
    id: speaker_enable
    name: Speaker enable
    icon: mdi:speaker
    entity_category: config
    pin: GPIO48
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mute
    name: Mute microphone
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - script.execute:
          id: set_phase
          phase: "muted"
    on_turn_off:
      - script.execute: start_wake_word
      - script.execute:
          id: set_phase
          phase: "idle"

  # Off = just the eye (prop look); on = wake word prompt, clock and transcript over it.
  - platform: template
    id: show_text
    name: Show text
    icon: mdi:format-text
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - script.execute:
          id: set_phase
          phase: !lambda return id(current_phase);

# --- VOICE --------------------------------------------------------------------

micro_wake_word:
  id: mww
  microphone: box_mic
  vad:
  models:
    - model: okay_nabu
    - model: hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: box_mic
  media_player: disc_media
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
          - script.execute:
              id: set_phase
              phase: "idle"
        else:
          - script.execute:
              id: set_phase
              phase: "muted"
  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - script.execute:
        id: set_phase
        phase: "no_ha"
  on_listening:
    - lvgl.label.update:
        id: text_label
        text: ""
    - script.execute:
        id: set_phase
        phase: "listening"
  on_stt_vad_end:
    - script.execute:
        id: set_phase
        phase: "thinking"
  on_stt_end:
    - lvgl.label.update:
        id: text_label
        text: !lambda return x;
  on_tts_start:
    - lvgl.label.update:
        id: text_label
        text: !lambda return x;
    - script.execute:
        id: set_phase
        phase: "replying"
  on_error:
    - lvgl.label.update:
        id: text_label
        text: !lambda return message;
    - script.execute:
        id: set_phase
        phase: "error"
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          lambda: return id(current_phase) == "error";
        then:
          - delay: 3s
    - if:
        condition:
          switch.is_off: mute
        then:
          - script.execute: start_wake_word
          - script.execute:
              id: set_phase
              phase: "idle"
  on_timer_started:
    - lvgl.label.update:
        id: text_label
        text: "Timer started"
  on_timer_finished:
    - lambda: id(timer_ringing) = true;
    - script.execute:
        id: set_phase
        phase: "timer"
    - script.execute: ring_timer

script:
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

  # Ring until tapped, up to ~5 minutes.
  - id: ring_timer
    mode: restart
    then:
      - repeat:
          count: 100
          then:
            - if:
                condition:
                  lambda: return !id(timer_ringing);
                then:
                  - script.stop: ring_timer
            - media_player.speaker.play_on_device_media_file:
                media_file: timer_sound
                announcement: true
            - delay: 3s
      - script.execute: stop_timer

  - id: stop_timer
    then:
      - lambda: id(timer_ringing) = false;
      - media_player.stop:
          id: disc_media
          announcement: true
      - lvgl.label.update:
          id: text_label
          text: ""
      - script.execute:
          id: set_phase
          phase: !lambda 'return id(mute).state ? std::string("muted") : std::string("idle");'

  # Eye state + status text for each phase; any phase except idle/no_ha wakes the screen.
  - id: set_phase
    parameters:
      phase: string
    then:
      - lambda: |-
          id(current_phase) = phase;
          const char *status = "";
          float eye = 0;   // 0 closed/aligned, 1 open (see the frame player)
          int variant = 0; // 0 green, 1 yellow pulse, 2 red, 3 purple
          if (phase == "idle")           { status = id(idle_prompt).c_str(); }
          else if (phase == "listening") { status = "Listening...";       eye = 1; }
          else if (phase == "thinking")  { status = "Thinking...";        eye = 1; variant = 1; }
          else if (phase == "replying")  { status = "";                   eye = 1; }
          else if (phase == "error")     { status = "Error";              eye = 1; variant = 2; }
          else if (phase == "muted")     { status = "Muted"; }
          else if (phase == "timer")     { status = "Timer! Tap to stop"; eye = 1; variant = 3; }
          else if (phase == "no_ha")     { status = "Connecting to HA..."; }
          id(eye_target) = eye;
          id(eye_variant) = variant;
          lv_label_set_text(id(status_label), status);
          // Text off = pure prop look. Otherwise: status on top (hidden when empty); bottom slot
          // is the clock while resting, transcript/reply while a conversation is on.
          bool text = id(show_text).state;
          bool resting = (phase == "idle" || phase == "muted" || phase == "no_ha");
          if (resting) lv_label_set_text(id(text_label), "");
          auto show = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          show(id(status_label), text && status[0] != 0);
          show(id(time_label), text && resting);
          show(id(text_label), text && !resting);
      - if:
          condition:
            lambda: return id(current_phase) != "idle" && id(current_phase) != "no_ha";
          then:
            - script.execute: activity

  # Bright now, dim after 2 minutes of nothing happening. "Bright" is 75%, not 100%, to cut the
  # wake-up power spike on the wireless puck (with the 50% volume cap and no wake chime).
  - id: activity
    mode: restart
    then:
      - light.turn_on:
          id: backlight
          brightness: 75%
          transition_length: 200ms
      - delay: 120s
      - light.turn_on:
          id: backlight
          brightness: 15%
          transition_length: 2s

  - id: draw_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          lv_label_set_text(id(time_label), now.strftime("%H:%M").c_str());

# --- DISPLAY + TOUCH ----------------------------------------------------------

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO9
  data_pins: [GPIO11, GPIO12, GPIO13, GPIO14]

i2c:
  id: touch_bus
  sda: GPIO7
  scl: GPIO8

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    update_interval: never
    auto_clear_enabled: false

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO15

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    icon: mdi:television
    entity_category: config
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: touch_bus
    interrupt_pin: GPIO41
    reset_pin: GPIO40
    display: main_display
    on_release:
      - if:
          # A dim screen's first tap only wakes it.
          condition:
            lambda: return id(backlight).current_values.get_brightness() < 0.5f;
          then:
            - script.execute: activity
          else:
            - script.execute: activity
            - if:
                condition:
                  lambda: return id(timer_ringing);
                then:
                  - script.execute: stop_timer
                else:
                  - if:
                      condition:
                        voice_assistant.is_running:
                      then:
                        - voice_assistant.stop:
                      else:
                        - if:
                            condition:
                              and:
                                - switch.is_off: mute
                                - api.connected:
                            then:
                              - media_player.stop:
                                  id: disc_media
                              - voice_assistant.start:

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_clock
    size: 34
    glyphs: "0123456789:-"
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_small
    size: 18
    glyphsets: [GF_Latin_Core]

# Eye of Agamotto frames (centre disc only), pre-rendered by art/make_eye.py from
# art/source/eye.png. Both folders are gitignored (third-party design; this repo is public) -
# run the script before building. 18 x 259 KB of flash.
image:
  defaults:
    type: RGB565
  images:
    - file: art/out/f00.png
      id: eye_f00
    - file: art/out/f01.png
      id: eye_f01
    - file: art/out/f02.png
      id: eye_f02
    - file: art/out/f03.png
      id: eye_f03
    - file: art/out/f04.png
      id: eye_f04
    - file: art/out/f05.png
      id: eye_f05
    - file: art/out/f06.png
      id: eye_f06
    - file: art/out/f07.png
      id: eye_f07
    - file: art/out/f08.png
      id: eye_f08
    - file: art/out/f09.png
      id: eye_f09
    - file: art/out/f10.png
      id: eye_f10
    - file: art/out/f11.png
      id: eye_f11
    - file: art/out/f12.png
      id: eye_f12
    - file: art/out/f13.png
      id: eye_f13
    - file: art/out/open_yellow.png
      id: eye_yellow
    - file: art/out/open_yellow2.png
      id: eye_yellow2
    - file: art/out/open_red.png
      id: eye_red
    - file: art/out/open_purple.png
      id: eye_purple

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 100%
  rotation: 180
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      widgets:
        - image:
            id: eye_w
            src: eye_f00
            align: CENTER
        - label:
            id: status_label
            align: TOP_MID
            y: 26
            width: 200
            long_mode: SCROLL_CIRCULAR
            text_align: CENTER
            text_font: font_small
            text_color: 0xE0E0E0
            bg_color: 0x000000
            bg_opa: 60%
            radius: 10
            pad_left: 8
            pad_right: 8
            pad_top: 2
            pad_bottom: 2
            text: "Connecting to HA..."
        - label:
            id: time_label
            align: BOTTOM_MID
            y: -22
            text_font: font_clock
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 60%
            radius: 10
            pad_left: 8
            pad_right: 8
            pad_top: 2
            pad_bottom: 2
            text: "--:--"
        - label:
            id: text_label
            align: BOTTOM_MID
            y: -20
            width: 200
            height: 44
            long_mode: DOT
            text_align: CENTER
            text_font: font_small
            text_color: 0xFFFFFF
            bg_color: 0x000000
            bg_opa: 60%
            radius: 10
            pad_left: 8
            pad_right: 8
            hidden: true
            text: ""
