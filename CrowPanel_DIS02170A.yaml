# !! DO NOT CHANGE: sda/scl confirmed correct from Elecrow factory code !!
# !! DO NOT change scan to true — it locks up the I2C bus and crashes the device !!
i2c:
  sda: 15
  scl: 16
  scan: false
  id: bus_a

# GT911 touch — address 0x5D (Elecrow official, ESPHome gt911 PRIMARY_ADDRESS).
#   ESPHome driver auto-falls back 0x5D→0x14 if 0x5D fails; fallback ONLY works from 0x5D.
#   Configuring 0x14 directly disables the fallback mechanism.
# !! DO NOT REMOVE calibration block — it sets x_raw_max_=800 which bypasses the
#   GET_MAX_VALUES register read (which fails for unknown reasons on this board). !!
# !! DO NOT change address to 0x14 — loses auto-fallback. Use 0x5D for both addresses. !!
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    address: 0x5D
    update_interval: 16ms
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 480
    on_touch:
      then:
        - logger.log:
            level: INFO
            format: "Touch: x=%d y=%d"
            args: [touch.x, touch.y]

# !! DO NOT CHANGE any display settings — this exact config produces a working image !!
# color_order: RGB + invert_colors: true — tuned values; changing either breaks colors.
# data_pins order matters — these LSB-first pin assignments are correct for SC7277 driver.
# pclk_frequency: 20MHz + timing values (4/8/8) — confirmed stable.
# !! DO NOT add GPIO38 to interrupt_pin on GT911 — it is used here as blue[4] (B MSB) !!
display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    pclk_frequency: 20MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red:
        - 7    # R0 (LSB)
        - 17   # R1
        - 18   # R2
        - 3    # R3
        - 46   # R4 (MSB)
      green:
        - 9    # G0 (LSB)
        - 10   # G1
        - 11   # G2
        - 12   # G3
        - 13   # G4
        - 14   # G5 (MSB)
      blue:
        - 21   # B0 (LSB)
        - 47   # B1
        - 48   # B2
        - 45   # B3
        - 38   # B4 (MSB) — DO NOT use GPIO38 as GT911 interrupt_pin

time:
  - platform: homeassistant
    id: time_comp

# Diagnostic: full I2C scan (0x08-0x77) published from on_boot, visible in HA after connection.
# Scan runs 500ms after {0x10} (RST release). GT911 initializes AFTER the scan window —
# scan consistently shows "30 51" even when GT911 responds to the driver 200ms later.
# Known devices: 0x30=STC8H1K28 (always), 0x51=PCF8563 RTC (always).
# GT911 (0x5D or 0x14) does NOT appear in scan — it only responds after the scan window.
# ESP-IDF 5.5.4 removed legacy I2C API; using ESPHome write(addr, &dummy, 0) probe.
text_sensor:
  - platform: template
    name: "I2C Scan"
    id: i2c_scan
    update_interval: never

# !! DO NOT CHANGE: use "displays: main_display" (scalar). !!
# !! DO NOT use "display_id:" — it fails. DO NOT change to a list form. !!
lvgl:
