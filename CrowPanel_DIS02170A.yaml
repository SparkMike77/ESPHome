esphome:
  name: crowpanel
  friendly_name: Crowpanel
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          uint8_t cmd[1] = { 0x10 };
          id(bus_a).write(0x30, cmd, 1);
      - switch.turn_off: gt911_rst
      - delay: 20ms
      - switch.turn_on: gt911_rst
      - delay: 200ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "U3pDL0/hc4GLUAi20WDkRcwBQLmrsGyQeJQ7nhP8/sY="

ota:
  - platform: esphome
    password: "b2c1b5b206a36559468ec73281b6fa37"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Crowpanel Fallback Hotspot"
    password: "Inn0mined30!"

web_server:
  port: 80

captive_portal:

image:
  - file: "small_temp.png"
    id: small_temp
    resize: 200x200
    type: RGB565
  - file: "small_hum.png"
    id: small_hum
    resize: 200x200
    type: RGB565
  - file: "small_logo.png"
    id: small_logo
    resize: 200x100
    type: RGB565
  - file: "light.png"
    id: light_on
    resize: 200x200
    type: RGB565
  - file: "no_light.png"
    id: light_off
    resize: 200x200
    type: RGB565

i2c:
  sda: 15
  scl: 16
  scan: false
  id: bus_a

pca9554:
  - id: io_exp
    address: 0x18
    i2c_id: bus_a

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Room Temperature"
      id: room_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Room Humidity"
      id: room_hum
      unit_of_measurement: "%"
      accuracy_decimals: 1
    update_interval: 1s

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    address: 0x14
    update_interval: 16ms
    on_touch:
      then:
        - logger.log:
            level: INFO
            format: "Touch: x=%d y=%d"
            args: [touch.x, touch.y]

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    pclk_frequency: 20MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red:
        - 7
        - 17
        - 18
        - 3
        - 46
      green:
        - 9
        - 10
        - 11
        - 12
        - 13
        - 14
      blue:
        - 21
        - 47
        - 48
        - 45
        - 38

time:
  - platform: homeassistant
    id: time_comp

lvgl:
  log_level: INFO
  color_depth: 16
  bg_color: 0xFFFFFF
  text_font: montserrat_26
  touchscreens:
    - touch
  widgets:
    - image:
        id: lvgl_logo
        src: small_logo
        x: 300
        y: 20
    - image:
        id: lvgl_temp
        src: small_temp
        x: 150
        y: 250
    - image:
        id: lvgl_hum
        src: small_hum
        x: 400
        y: 250
    - image:
        id: lvgl_light
        src: light_off
        x: 650
        y: 250
    - label:
        id: label_temp
        x: 90
        y: 350
        text: "Temp: --°C"
    - label:
        id: label_hum
        x: 350
        y: 350
        text: "Humi: --%"
    - label:
        id: label_light_state
        x: 650
        y: 350
        text: "OFF"

interval:
  - interval: 5s
    then:
      - lambda: |-
          uint8_t buf[1] = {0};
          auto err5d = id(bus_a).read(0x5D, buf, 1);
          auto err14 = id(bus_a).read(0x14, buf, 1);
          auto err18 = id(bus_a).read(0x18, buf, 1);
          ESP_LOGI("i2c_probe", "0x5D=%d  0x14=%d  0x18=%d (0=OK)", err5d, err14, err18);
  - interval: 1s
    then:
      - lambda: |-
          char temp_str[20];
          char hum_str[20];
          snprintf(temp_str, sizeof(temp_str), "Temp: %.1f°C", id(room_temp).state);
          snprintf(hum_str, sizeof(hum_str), "Humi: %.1f%%", id(room_hum).state);
          lv_label_set_text(id(label_temp), temp_str);
          lv_label_set_text(id(label_hum), hum_str);

switch:
  - platform: gpio
    id: gt911_rst
    internal: true
    pin:
      pca9554: io_exp
      number: 2
      mode:
        output: true
      inverted: false

  - platform: template
    name: "Backlight Max (0)"
    id: bl_max
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0x00;
          id(bus_a).write(0x30, &cmd, 1);

  - platform: template
    name: "Backlight Off (245)"
    id: bl_off
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0xF5;
          id(bus_a).write(0x30, &cmd, 1);

  - platform: template
    name: "Backlight 50%"
    id: bl_50
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0x7D;
          id(bus_a).write(0x30, &cmd, 1);

number:
  - platform: template
    name: "Backlight Level"
    id: bl_level
    min_value: 0
    max_value: 245
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t cmd = (uint8_t)x;
          id(bus_a).write(0x30, &cmd, 1);
