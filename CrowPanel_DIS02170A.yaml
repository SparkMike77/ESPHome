    - label:
        id: label_light_state
        x: 650
        y: 350
        text: "OFF"


# Backlight control via STC8H1K28 MCU at I2C 0x30.
# Value range: 0x00 = max brightness, 0xF5 (245) = off.
switch:
  - platform: template
    name: "Backlight Max (0)"
    id: bl_max
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0x00;
          id(bus_a).write(0x30, &cmd, 1);

  - platform: template
    name: "Backlight Off (245)"
    id: bl_off
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0xF5;
          id(bus_a).write(0x30, &cmd, 1);

  - platform: template
    name: "Backlight 50%"
    id: bl_50
    optimistic: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd = 0x7D;
          id(bus_a).write(0x30, &cmd, 1);

number:
  - platform: template
    name: "Backlight Level"
    id: bl_level
    min_value: 0
    max_value: 245
    step: 1
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t cmd = (uint8_t)x;
          id(bus_a).write(0x30, &cmd, 1);
