esphome:
  name: xh-s3e-voice
  friendly_name: XH-S3E Voice
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(oled_display).turn_off();
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "xh-s3e-fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO41
  scl: GPIO42
  scan: true
  frequency: 400kHz

globals:
  - id: init_done
    type: bool
    restore_value: no
    initial_value: "true"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: XH-S3E IP
    ssid:
      id: wifi_name
      name: XH-S3E SSID

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_speaker
    i2s_dout_pin: GPIO7
    dac_type: external
    channel: mono

media_player:
  - platform: speaker
    name: "XH-S3E Announcements"
    announcement_pipeline:
      speaker: spk

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 16

micro_wake_word:
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json@main
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json@main
  on_wake_word_detected:
    - lambda: |-
        id(oled_display).turn_on();
    - component.update: oled_display
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: mic
  speaker: spk
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_end:
    - micro_wake_word.start
    - delay: 2s
    - lambda: |-
        id(oled_display).turn_off();
  on_error:
    - micro_wake_word.stop:
    - delay: 500ms
    - micro_wake_word.start:
    - delay: 2s
    - lambda: |-
        id(oled_display).turn_off();

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Boot Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO47
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Touch Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO40
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Volume Up Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO39
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Volume Down Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

output:
  - platform: ledc
    id: rgb_red
    pin:
      number: GPIO48
      inverted: false

light:
  - platform: monochromatic
    name: "RGB LED"
    output: rgb_red

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: never
    lambda: |-
      it.print(0, 0, id(font_big), "Hello World");
      if (id(init_done)) {
        if (id(va).is_running()) {
          it.print(0, 18, id(font_small), "Assist: active");
        } else {
          it.print(0, 18, id(font_small), "Assist: idle");
        }
        it.print(0, 34, id(font_small), "Wake: waiting");
        it.printf(0, 50, id(font_small), "WiFi: %s", id(wifi_name).state.c_str());
      }