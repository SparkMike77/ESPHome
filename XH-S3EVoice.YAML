esphome:
  name: xh-s3e-voice
  friendly_name: XH-S3E Voice
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(oled_display).turn_off();
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "xh-s3e-fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

i2c:
  sda: GPIO41
  scl: GPIO42
  scan: true
  frequency: 400kHz

globals:
  - id: init_done
    type: bool
    restore_value: no
    initial_value: "true"
  - id: is_speaking
    type: bool
    restore_value: no
    initial_value: "false"
  - id: is_blinking
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: XH-S3E IP
    ssid:
      id: wifi_name
      name: XH-S3E SSID

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO15

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_speaker
    i2s_dout_pin: GPIO7
    dac_type: external
    channel: mono

media_player:
  - platform: speaker
    name: "XH-S3E Announcements"
    announcement_pipeline:
      speaker: spk

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_big
    size: 16

micro_wake_word:
  models:
    - model: hey_jarvis.json #github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json@main
  vad:
    model: vad.json    #github://esphome/micro-wake-word-models/models/v2/vad.json@main
  on_wake_word_detected:
    - globals.set:
        id: is_blinking
        value: "true"
    - lambda: id(oled_display).turn_on();
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: mic
  speaker: spk
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_start:
    - globals.set:
        id: is_blinking
        value: "false"
  on_tts_start:
    - globals.set:
        id: is_speaking
        value: "true"
  on_tts_end:
    - globals.set:
        id: is_speaking
        value: "false"
    - script.execute: display_off_timer
  on_end:
    - micro_wake_word.start:
    - script.execute: display_off_timer
  on_error:
    - micro_wake_word.stop:
    - globals.set:
        id: is_blinking
        value: "false"
    - globals.set:
        id: is_speaking
        value: "false"
    - delay: 500ms
    - micro_wake_word.start:
    - delay: 2s
    - lambda: id(oled_display).turn_off();

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Boot Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO47
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Touch Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO40
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Volume Up Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

  - platform: gpio
    pin:
      number: GPIO39
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Volume Down Button"
    on_press:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop
              - delay: 500ms
              - lambda: |-
                  id(oled_display).turn_off();
            else:
              - lambda: |-
                  id(oled_display).turn_on();
              - component.update: oled_display
              - voice_assistant.start

output:
  - platform: ledc
    id: rgb_red
    pin:
      number: GPIO48
      inverted: false

light:
  - platform: monochromatic
    name: "RGB LED"
    output: rgb_red

script:
  - id: display_off_timer
    mode: restart
    then:
      - delay: 5s
      - lambda: id(oled_display).turn_off();

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      const int LEFT_X = 32, RIGHT_X = 96, EYE_Y = 32, EYE_R = 20;
      int pupil_r = id(is_speaking) ? 5 : 2;
      if (id(is_blinking)) {
        bool closed = (millis() % 3000) < 150;
        if (closed) {
          it.line(LEFT_X - EYE_R, EYE_Y, LEFT_X + EYE_R, EYE_Y);
          it.line(RIGHT_X - EYE_R, EYE_Y, RIGHT_X + EYE_R, EYE_Y);
        } else {
          it.circle(LEFT_X, EYE_Y, EYE_R);
          it.filled_circle(LEFT_X, EYE_Y, 2);
          it.circle(RIGHT_X, EYE_Y, EYE_R);
          it.filled_circle(RIGHT_X, EYE_Y, 2);
        }
      } else if (id(va).is_running()) {
        uint32_t t = millis() % 5000;
        int offset = 0;
        if      (t > 1500 && t < 1800) offset = -8;
        else if (t > 3200 && t < 3500) offset =  8;
        bool closed = (millis() % 2000) < 150;
        if (closed) {
          it.line(LEFT_X - EYE_R, EYE_Y, LEFT_X + EYE_R, EYE_Y);
          it.line(RIGHT_X - EYE_R, EYE_Y, RIGHT_X + EYE_R, EYE_Y);
        } else {
          it.circle(LEFT_X, EYE_Y, EYE_R);
          it.filled_circle(LEFT_X + offset, EYE_Y, 2);
          it.circle(RIGHT_X, EYE_Y, EYE_R);
          it.filled_circle(RIGHT_X + offset, EYE_Y, 2);
        }
      } else {
        bool closed = (millis() % 4000) < 150;
        if (closed) {
          it.line(LEFT_X - EYE_R, EYE_Y, LEFT_X + EYE_R, EYE_Y);
          it.line(RIGHT_X - EYE_R, EYE_Y, RIGHT_X + EYE_R, EYE_Y);
        } else {
          it.circle(LEFT_X, EYE_Y, EYE_R);
          it.filled_circle(LEFT_X, EYE_Y, 2);
          it.circle(RIGHT_X, EYE_Y, EYE_R);
          it.filled_circle(RIGHT_X, EYE_Y, 2);
        }
      }